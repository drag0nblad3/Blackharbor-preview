<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blackharbor Preview — Combat Art Lab</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bangers&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="art.css">
  <link rel="stylesheet" href="investigation.css">
  <link rel="stylesheet" href="comic-ui.css">
  <link rel="stylesheet" href="pulp-details.css">
  <link rel="stylesheet" href="villain-portraits.css">
  <link id="battle-art-pack" rel="stylesheet" href="battle-graphics.css">
  <link rel="stylesheet" href="miniature-experiment.css">
  <style>
    :root{color-scheme:light}
    .art-lab-bar{position:sticky;top:0;z-index:90;
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;
      padding:8px max(10px,calc((100vw - 1480px)/2));
      background:linear-gradient(110deg,#112a42,#28506b);color:#fff;
      border-bottom:4px solid #f2c741;
      font:700 12px/1.3 Archivo,system-ui,sans-serif;
      box-shadow:0 3px 0 #132136}
    .art-lab-title{display:flex;flex-direction:column;gap:2px;min-width:130px}
    .art-lab-title b{font:1rem/1.12 'Bowlby One',sans-serif;letter-spacing:.01em}
    .art-lab-title span{color:#b9d9e9;font-size:11px}
    .art-lab-controls{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
    .art-lab-bar label{display:flex;align-items:center;gap:6px;color:#e3eef4}
    .art-lab-bar select,.art-lab-bar button,.art-lab-bar a{
      appearance:none;background:#fff7d7;color:#142238;
      border:2px solid #081e2c;min-height:37px;border-radius:2px;
      padding:6px 10px;font:800 12px Archivo,system-ui,sans-serif;
      box-shadow:2px 2px 0 #030d1a;text-decoration:none;cursor:pointer;
    }
    .art-lab-bar button{background:#f6cc45}
    .art-lab-bar button[aria-pressed="false"]{background:#bad6e5}
    .art-lab-bar button:focus-visible,.art-lab-bar a:focus-visible,.art-lab-bar select:focus-visible{
      outline:3px solid #ffe35a;outline-offset:2px}
    #lab-notice{max-width:1480px;margin:8px auto 4px;padding:7px 11px;
      background:#fff5cf;color:#263b50;border:2px solid #173d58;
      font:700 12px/1.4 Archivo,system-ui,sans-serif}
    #app{padding-top:2px}
    @media(max-width:600px){
      .art-lab-bar{padding:7px;gap:5px}
      .art-lab-title b{font-size:.8rem}
      .art-lab-controls{width:100%;justify-content:space-between}
      .art-lab-bar label{flex:1}
      .art-lab-bar select{max-width:120px}
      .art-lab-bar a{padding:6px}
      #lab-notice{margin:6px 7px 3px;font-size:11px}
    }
  </style>
</head>
<body>
  <div class="art-lab-bar">
    <div class="art-lab-title"><b>COMBAT ART LAB</b><span>Real game engine · Preview-only · Doesn't save</span></div>
    <div class="art-lab-controls">
      <label for="lab-villain">Lair <select id="lab-villain"></select></label>
      <button id="lab-compare" type="button" aria-pressed="true">Illustrated graphics ON</button>
      <button id="lab-miniatures" type="button" aria-pressed="true">New hero art ON</button>
      <a href="index.html">Back to preview</a>
    </div>
  </div>
  <p id="lab-notice">Explore the real board, terrain and unit graphics. Compare both battle materials and brand-new illustrated hero miniatures against the original art. This lab never reads or writes your campaign save.</p>
  <div class="wrap" id="app"></div>
  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="battle.js"></script>
  <script src="boss-mechanics.js"></script>
  <script src="sprite.js"></script>
<script src="equipment-icons.js"></script>
<link rel="stylesheet" href="equipment-icons.css">
  <script src="art.js"></script>
  <link rel="stylesheet" href="hero-loadout.css">
  <script src="hero-loadout.js"></script>
  <script>
  /* The art lab deliberately suppresses saves and never calls load(). */
  save=()=>{};
  (function(){
    const picker=document.getElementById('lab-villain');
    Object.keys(VILLAINS).filter(k=>!VILLAINS[k].intro).forEach(k=>{
      const option=document.createElement('option');
      option.value=k;option.textContent=VILLAINS[k].name;
      picker.appendChild(option);
    });
    function scene(k){
      newCampaign();
      S.guide=null;S.tut=null;S.tutDone=true;S.tipsOff=true;
      S.heroes=['volt','bulwark','wisp','lynx'].map(cls=>newHero(cls));
      S.party=S.heroes.map(h=>h.id);
      S.villains=[makeVillain(k,2)];
      S.pool=[];
      S.inv={v:k,clues:3};
      startShowdown();
      S.sd.intro=false;S.sd.sel=0;S.sd.busy=false;
      render();
    }
    picker.addEventListener('change',()=>scene(picker.value));
    const toggle=document.getElementById('lab-compare'),css=document.getElementById('battle-art-pack');
    toggle.addEventListener('click',()=>{
      css.disabled=!css.disabled;
      toggle.setAttribute('aria-pressed',String(!css.disabled));
      toggle.textContent=css.disabled?'Classic graphics ON':'Illustrated graphics ON';
    });
    document.body.classList.add('bh-new-miniatures');
    const miniBtn=document.getElementById('lab-miniatures');
    miniBtn.addEventListener('click',()=>{
      const enabled=document.body.classList.toggle('bh-new-miniatures');
      miniBtn.setAttribute('aria-pressed',String(enabled));
      miniBtn.textContent=enabled?'New hero art ON':'Original hero art ON';
    });
    picker.value='cantor';
    try{scene(picker.value)}catch(e){
      document.getElementById('lab-notice').textContent='Could not start demonstration: '+e.message;
      throw e;
    }
  })();
  </script>
</body>
</html>
