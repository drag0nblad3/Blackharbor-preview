<script>
document.getElementById('app').className='wrap sprite-gallery';
const galleryGroups=[['Heroes',Object.keys(HERO_BASE)],['Villains',ISO_COVER_GROUPS.flat()],['Henchmen and swarm bodies',[...ISO_CAST_GROUPS.flat().filter(k=>k.startsWith('m-')), 'sting','shell']],['Civilians',['civilian','civilian2']]];
const spriteName=k=>HERO_BASE[k]?.name||VILLAINS[k]?.name||({sting:'Murmur · Stinger',shell:'Murmur · Shell',civilian:'Civilian · Grey coat',civilian2:'Civilian · Yellow raincoat'})[k]||(VILLAINS[k.slice(2)]?.short||'Digger')+' henchman';
document.getElementById('app').innerHTML='<header><h1>BLACKHARBOR · FULL CAST</h1><p>37 character sprites · Bold ink and cel-shaded superhero style</p><a href="isometric-lab.html">Play the battlefield preview</a></header>'+galleryGroups.map(([title,keys])=>`<section><h2>${title}</h2><div class="sprite-gallery-grid">${keys.map(k=>`<article class="sprite-gallery-card"><div class="sprite-gallery-art">${isoSprite(k,'',1)}</div><h3>${esc(spriteName(k))}</h3></article>`).join('')}</div></section>`).join('');
</script>
