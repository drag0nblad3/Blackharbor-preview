name: Simulated battle regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/simulated-battle.cjs'
      - 'tests/layout-smoke.cjs'
      - 'comic-ui.css'
      - 'pulp-details.css'
      - 'villain-portraits.avif'
      - 'portrait-gallery.html'
      - 'investigation.css'
      - 'game.css'
      - 'battle.js'
      - 'game.js'
      - 'index.html'
      - '.github/workflows/simulated-battle.yml'
jobs:
  simulated-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run simulated battle test
        run: node tests/simulated-battle.cjs
      - name: Check screen layout at phone and desktop sizes
        run: node tests/layout-smoke.cjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackharbor-layout-screenshots
          path: layout-shots/
          if-no-files-found: ignore
