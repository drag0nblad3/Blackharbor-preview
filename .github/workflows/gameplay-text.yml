name: Gameplay text accuracy
on:
  push:
    branches: [main]
    paths:
      - 'tests/gameplay-text.cjs'
      - '.github/workflows/gameplay-text.yml'
      - 'game.js'
      - 'data.js'
      - 'battle.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/gameplay-text.cjs
      - run: node tests/payload-bombs.cjs
      - run: node tests/cantor-rework.cjs
