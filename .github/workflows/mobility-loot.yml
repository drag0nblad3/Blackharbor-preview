name: Mobility loot strategy comparison
on:
  push:
    branches: [main]
    paths:
      - 'tests/mobility-loot.cjs'
      - '.github/workflows/mobility-loot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare mobility loot investment
        run: node tests/mobility-loot.cjs
      - name: Upload matched result data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobility-loot-results
          path: mobility-loot-results/
          if-no-files-found: warn
