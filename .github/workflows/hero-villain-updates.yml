name: Payload and Cantor combat verification
on:
  push:
    branches: [main]
    paths:
      - 'tests/payload-bombs.cjs'
      - 'tests/cantor-rework.cjs'
      - '.github/workflows/hero-villain-updates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/payload-bombs.cjs
      - run: node tests/cantor-rework.cjs
      - run: node tests/balance.cjs
      - run: node tests/boss-selection.cjs
  campaign-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete campaigns across nine strategies
        env:
          RUNS: '6'
          SEED: '77'
          JOBS: '3'
        run: node tests/campaign-strategies.cjs
  matchup:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        group: [mixed, tech, magic, innate]
    env:
      GROUP: ${{ matrix.group }}
      SEEDS: '12'
      SEED_START: '2300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retest every villain with controlled hero teams
        run: node tests/villain-matchup.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: villain-matchup-${{ matrix.group }}
          path: villain-matchup-results/
          if-no-files-found: error
  matchup-report:
    needs: [focused, matchup, campaign-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: villain-matchup-*
          path: villain-matchup-results/
          merge-multiple: true
      - name: Aggregate 1584 controlled battles
        run: node tests/villain-matchup-report.cjs
      - name: Summarize modified bosses
        run: |
          node -e "const s=require('./villain-matchup-results/summary.json');for(const b of s.bosses.filter(b=>['bomber','cantor'].includes(b.key)))console.log('REVISED',JSON.stringify({boss:b.key,fights:b.fights,winPct:b.winPct,teams:b.teams}))"
      - uses: actions/upload-artifact@v4
        with:
          name: payload-cantor-encounter-study
          path: villain-matchup-results/
          if-no-files-found: error
