name: Portable save and load
on:
  push:
    branches: [main]
    paths:
      - 'save-menu.js'
      - 'tests/save-load.cjs'
      - '.github/workflows/save-load-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --check save-menu.js
      - run: node tests/save-load.cjs
