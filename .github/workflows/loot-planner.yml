name: Bot loot planning
on:
  push:
    branches: [main]
    paths:
      - 'tools/bot.js'
      - 'tests/loot-planner.cjs'
      - '.github/workflows/loot-planner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loot-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify salvage reservation and campaign completion
        env:
          CAMPAIGN_SMOKE: '1'
        run: node tests/loot-planner.cjs
