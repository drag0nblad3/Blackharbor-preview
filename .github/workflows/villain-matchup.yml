name: Villain mechanics controlled matchups
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of paired seeds per villain, team, and tier'
        default: '12'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'tests/villain-matchup.cjs'
      - 'tests/villain-matchup-report.cjs'
      - '.github/workflows/villain-matchup.yml'
permissions:
  contents: read
jobs:
  run-matchups:
    name: Equalized party - ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [mixed, tech, magic, innate]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GROUP: ${{ matrix.group }}
      SEEDS: ${{ inputs.seeds || '12' }}
      SEED_START: '2300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seeded, equalized boss matchups
        run: node tests/villain-matchup.cjs
      - name: Upload team matchup records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villain-matchup-${{ matrix.group }}
          path: villain-matchup-results/
          if-no-files-found: warn
  report:
    name: Analyze villain mechanics and matched difficulty
    needs: run-matchups
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: villain-matchup-*
          path: villain-matchup-results/
          merge-multiple: true
      - name: Aggregate controlled tests and features
        run: node tests/villain-matchup-report.cjs
      - name: Print encounter analysis
        run: cat villain-matchup-results/REPORT.md
      - name: Upload complete matched encounter study
        uses: actions/upload-artifact@v4
        with:
          name: villain-mechanics-study
          path: villain-matchup-results/
          if-no-files-found: error
