name: Villain balance change verification
on:
  push:
    branches: [main]
    paths:
      - 'tests/villain-rebalance.cjs'
      - 'tests/balance.cjs'
      - '.github/workflows/villain-rebalance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate villain changes and Payload's special ranged elite
        run: node tests/villain-rebalance.cjs
      - name: Gear balance regressions
        run: node tests/balance.cjs
      - name: Adaptive boss selection regressions
        run: node tests/boss-selection.cjs
  campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        strategy: [balanced, assault, fortress, mobility, support, specialist, techOnly, magicOnly, innateOnly]
    env:
      STRATEGY: ${{ matrix.strategy }}
      RUNS: '60'
      SEED: '1700'
      JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate 60 matched-seed campaigns
        run: node tests/large-campaign-study.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-campaign-${{ matrix.strategy }}
          path: campaign-study-results/
          if-no-files-found: warn
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        group: [mixed, tech, magic, innate]
    env:
      GROUP: ${{ matrix.group }}
      SEEDS: '12'
      SEED_START: '2300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retest all villains with matched heroes and levels
        run: node tests/villain-matchup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-encounters-${{ matrix.group }}
          path: villain-matchup-results/
          if-no-files-found: warn
  report:
    needs: [focused, campaigns, encounters]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: revised-campaign-*
          path: campaign-study-results/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: revised-encounters-*
          path: villain-matchup-results/
          merge-multiple: true
      - name: Analyze 540 campaigns and 1,584 controlled battles
        run: |
          node tests/large-campaign-report.cjs
          node tests/villain-matchup-report.cjs
      - name: Print revised overview
        run: |
          echo '=== Revised campaign statistics ==='
          node -e "const x=require('./campaign-study-results/summary.json');console.log(JSON.stringify({total:x.total,stages:x.stages,cohorts:x.cohorts.map(z=>({strategy:z.strategy,winPct:z.winPct,finaleWins:z.finaleWins})),bosses:x.bosses.map(b=>({boss:b.boss,n:b.fights,winPct:b.winPct,gap:b.adjustedWinGapPp}))}))"
          echo '=== Revised controlled matchups ==='
          node -e "const x=require('./villain-matchup-results/summary.json');console.log(JSON.stringify(x.bosses.map(b=>({boss:b.key,winPct:b.winPct,avgKOs:b.avgKOs,teams:b.teams}))))"
      - uses: actions/upload-artifact@v4
        with:
          name: revised-villain-balance-report
          path: |
            campaign-study-results/
            villain-matchup-results/
          if-no-files-found: error
