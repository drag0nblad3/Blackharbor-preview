name: Full tactical regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/tactical-actions.cjs
      - run: node tests/avoid-damage.cjs
      - run: node tests/combat-menus.cjs
      - run: node --check save-menu.js
      - run: node tests/save-load.cjs
      - run: node tests/simulated-battle.cjs
