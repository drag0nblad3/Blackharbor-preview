name: Deploy Blackharbor Preview

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portrait-gallery.html'
      - 'equipment-gallery.html'
      - 'combat-art-lab.html'
      - 'miniature-gallery.html'
      - '*.js'
      - 'src/**'
      - 'css/**'
      - '*.css'
      - '*.svg'
      - '*.avif'
      - 'assets/villain-covers/**'
      - 'assets/equipment/**'
      - 'assets/hero-loadout/**'
      - 'assets/guide/**'
      - 'PREVIEW_STATUS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble preview site
        run: |
          mkdir site
          cp index.html portrait-gallery.html combat-art-lab.html miniature-gallery.html equipment-gallery.html *.css *.avif *.svg site/
          cp -R assets src css site/
          # Own save slot: live and preview share the drag0nblad3.github.io origin, so they share localStorage
          sed -i "s/^const KEY='\([^']*\)';/const KEY='\1-preview';/" site/src/core/save.js
          grep -q "^const KEY='.*-preview';" site/src/core/save.js || { echo "Save key line not found in src/core/save.js"; exit 1; }
          # Mark the page so it is never mistaken for the live game
          src=$(sed -n 's/^Source: //p' PREVIEW_STATUS.md | tr -d '`<>&"')
          sed -i 's|<title>Blackharbor</title>|<title>Blackharbor PREVIEW</title>|' site/index.html
          echo "<div style=\"position:fixed;left:4px;bottom:4px;z-index:9999;pointer-events:none;font:700 11px monospace;background:#c2185b;color:#fff;padding:2px 6px;border-radius:4px;opacity:.85\">PREVIEW $src</div>" >> site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
