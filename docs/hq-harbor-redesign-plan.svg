<text x="52" y="787" font-size="18" font-weight="800">DESIGN INTENT</text>
<text x="52" y="815" class="legend">01 + 02: shared walls and roof junctions, authored as one fabrication complex.</text>
<text x="52" y="841" class="legend">03 + 07 + 12: nested science wing. 05 + 14: joined training court. 04 + 16: HQ roof sockets.</text>
<text x="52" y="867" class="legend">08 loads toward the east quay. 15 uses a separate blast court. 11 occupies the retaining wall.</text>
