<text x="52" y="934" class="small">Planning footprints only; final silhouettes, roof heights and sightlines are checked in the assembled game-camera view.</text>
<text x="52" y="960" class="small">Comic ink and cel shading · sci-fi structural shells + magical stonework · restrained lights, energy and water animation.</text>
